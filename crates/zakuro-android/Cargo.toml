[package]
name = "zakuro-android"
version = "0.2.30"
edition = "2021"
license = "MIT"

[lib]
name = "zakuro_android"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recall Fate's checkpoints (the same LZ4 as zakuro-core's save states)
lz4_flex = "0.14.0"

[dev-dependencies]
zakuro-gpu = { path = "../zakuro-gpu", default-features = false }
zakuro-core = { path = "../zakuro-core" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
libloading = "0.8"
jni = "0.21"
log = "0.4"
ndk = { version = "0.9", features = ["audio", "rwh_06", "api-level-28"] }
ndk-sys = "0.6"
raw-window-handle = "0.6"
zakuro-common = { path = "../zakuro-common" }
zakuro-core = { path = "../zakuro-core" }
zakuro-gpu = { path = "../zakuro-gpu", features = ["vulkan"] }
# ExaltDS's setup: the mod layers and the game code, built on the device
exalt-mods = { path = "../exalt-mods" }
recomp3ds = { git = "https://github.com/fearkov/3dsrecomp", rev = "730fbac3b104a904d1a3d2faab8b3c903fad7a09" }
zakuro-fs = { path = "../zakuro-fs" }
